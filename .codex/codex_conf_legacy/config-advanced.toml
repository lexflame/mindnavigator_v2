# Codex CLI advanced config template.
# Keep this file as an overlay and include sub-profiles.

include = [
  "config-basic.toml",
  "profiles/mcp.toml",
  "profiles/multi-agent.toml",
]

model_reasoning_effort = "high"
model_reasoning_summary = "auto"

# Choose one of your local file openers, or keep "none".
file_opener = "none"

# Useful defaults for longer tasks.
hide_agent_reasoning = false
show_raw_agent_reasoning = false

# Optional performance knobs for MCP tools.
mcp_tool_timeout_ms = 120000
mcp_server_startup_timeout_ms = 30000

[history]
persistence = "save-all"

[experimental]
resume = true
