# Multi-agent profile template.
# Toggle globally if your Codex CLI build supports multi-agent orchestration.

[multi_agent]
enabled = true

# Optional role hints for agent routing.
[agents.explorer]
model = "gpt-5.3-codex"
instructions = "Read-heavy codebase exploration and fast context gathering."

[agents.reviewer]
model = "gpt-5.3-codex"
instructions = "Risk-first review: bugs, regressions, missing tests, unsafe changes."

[agents.worker]
model = "gpt-5.3-codex"
instructions = "Implementation owner for focused code changes and verification."
