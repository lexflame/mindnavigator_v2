# Codex CLI basic config template (docs-aligned)

model = "gpt-5.3-codex"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Use the consolidated repository instructions file.
instructions_file = ".codex/AGENTS.md"

[history]
persistence = "save-all"

[tools]
web_search = true
request_user_input = true
view_image = true

# Replace this path if your local clone lives elsewhere.
[projects.'D:\_Branch\PROJECTS\project_work\mindnavigator\mindnavigator_v2']
trusted = true

# Optional desktop notification command.
# notify = ["python", "C:\\path\\to\\notify.py"]
