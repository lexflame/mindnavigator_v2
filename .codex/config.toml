# Codex project config for mindnavigator_v2
# Active local defaults should stay safe-by-default and cross-platform.

model = "gpt-5.3-codex"
profile = "balanced"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
model_reasoning_effort = "high"
model_reasoning_summary = "auto"
project_doc_fallback_filenames = [".codex/AGENTS.md", ".codex/SKILL.md", "AGENTS.md"]
project_doc_max_bytes = 65536

[history]
persistence = "save-all"
max_bytes = 52428800

[features]
multi_agent = true

[sandbox_workspace_write]
network_access = true
writable_roots = ["."]

[[skills.config]]
path = ".codex/skills/mindnavigator-routine"
enabled = true

[profiles.safe]
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_effort = "medium"

[profiles.balanced]
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
model_reasoning_effort = "high"

[profiles.aggressive]
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
model_reasoning_effort = "xhigh"

[agents.reviewer]
description = "Find security, correctness, and test risks in code."
config_file = "agents/reviewer.toml"

[agents.explorer]
description = "Fast codebase explorer for read-heavy tasks."
config_file = "agents/custom-explorer.toml"

# Optional MCP servers. Disabled by default to avoid startup failures when tools are not installed.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = false
startup_timeout_sec = 120
tool_timeout_sec = 120

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
enabled = false
startup_timeout_sec = 120
tool_timeout_sec = 120
